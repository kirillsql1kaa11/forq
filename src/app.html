<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon-32.png" sizes="32x32" type="image/png" />
		<link rel="icon" href="%sveltekit.assets%/favicon-16.png" sizes="16x16" type="image/png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="description" content="ForQ — минималистичная текстовая соцсеть. Короткие посты, одна лента, без алгоритмов." />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="ForQ" />
		<meta property="og:locale" content="ru_RU" />
		<meta property="og:title" content="ForQ — короткие текстовые посты" />
		<meta property="og:description" content="Минималистичная текстовая соцсеть: одна лента, посты до 500 символов, без алгоритмов." />
		<meta property="og:url" content="http://localhost:5173%sveltekit.assets%/" />
		<meta property="og:image" content="http://localhost:5173%sveltekit.assets%/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="ForQ — короткие текстовые посты" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="ForQ — короткие текстовые посты" />
		<meta name="twitter:description" content="Минималистичная текстовая соцсеть: одна лента, посты до 500 символов, без алгоритмов." />
		<meta name="twitter:image" content="http://localhost:5173%sveltekit.assets%/og.png" />
		<meta name="twitter:image:alt" content="ForQ — короткие текстовые посты" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<script>
			(() => {
				try {
					const theme = localStorage.getItem('forq-theme');
					const accent = localStorage.getItem('forq-accent');
					const root = document.documentElement;
					if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
					if (accent === 'emerald' || accent === 'amber' || accent === 'rose') {
						root.dataset.accent = accent;
					}
				} catch {
					return;
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
