<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
	<style>
		rect {
			fill: #0a0a0a;
		}
		circle {
			fill: none;
			stroke: #fafafa;
			stroke-width: 2.5;
		}
		line {
			stroke: #fafafa;
			stroke-width: 2.5;
			stroke-linecap: round;
		}
		@media (prefers-color-scheme: dark) {
			rect {
				fill: #fafafa;
			}
			circle,
			line {
				stroke: #0a0a0a;
			}
		}
	</style>
	<rect width="32" height="32" rx="8" />
	<circle cx="16" cy="15" r="6.5" />
	<line x1="19.5" y1="18.5" x2="23" y2="22" />
</svg>
